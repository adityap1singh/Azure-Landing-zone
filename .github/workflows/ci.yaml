name: CI Pipeline

on:
  push:
    branches:
      - main


jobs:
    source-code-validation:
      runs-on: ubuntu-latest

      steps:

        - name: checkout code 
          uses: actions/checkout@v4
        
        - name: java installation
          uses: actions/setup-java@v4
          with:
           distribution: 'temurin'
           java-version: '17'

        - name: sonar qube scan
          if: false
          uses: sonarsource/sonarcloud-github-action@v2


    container-validation:
      runs-on: ubuntu-latest
      needs: source-code-validation

      steps:

      - name: checkout code
        uses: actions/checkout@v4

      - name: docker build
        run: docker build -t landingzone:latest .

      - name: docker scan trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: landingzone:latest
          severity: HIGH,CRITICAL
    
    Infrastructure-validation:
      runs-on: ubuntu-latest
      needs: container-validation

      steps:
        
      - name: checkout code
        uses: actions/checkout@v4
       

      - name: Terraform installation
        uses: hashicorp/setup-terraform@v3
        with:
         terraform_version: 1.13.0
          

      - name: terraform init
        run: terraform init
        working-directory: ./Terraform/environment/dev

      - name: terraform validate
        run: terraform validate
        working-directory: ./Terraform/environment/dev

      - name: terraform plan
        run: terraform plan -out=plan.out
        working-directory: ./Terraform/environment/dev

      - name: Atifact upload
        uses: actions/upload-artifact@v4
        with:
            name: terraform-plan
            path: ./Terraform/environment/dev/plan.out



        
      