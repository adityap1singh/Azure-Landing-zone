name: CI Pipeline

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read


jobs:
    source-code-validation:
      runs-on: ubuntu-latest

      steps:
        - name: checkout code 
          uses: actions/checkout@v4
        
        - name: java installation
          uses: actions/setup-java@v4
          with:
           distribution: 'temurin'
           java-version: '17'

        - name: sonar qube scan
          if: false
          uses: SonarSource/sonarqube-scan-action@v8.2.1
          
        

    container-validation:
      runs-on: ubuntu-latest
      needs: source-code-validation

      steps:

      - name: checkout code
        uses: actions/checkout@v4

      - name: docker build
        run: docker build -t landingzone:latest .

      - name: docker scan trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: landingzone:latest
          severity: HIGH,CRITICAL
    
    Infrastructure-validation:
      runs-on: ubuntu-latest
      needs: container-validation

      defaults:
        run:
          working-directory: ./Terraform/environment/dev

      steps:
        
      - name: checkout code
        uses: actions/checkout@v4
       

      - name: Terraform installation
        uses: hashicorp/setup-terraform@v3
        with:
         terraform_version: 1.13.0


      - name: Azure Login
        if: false
        uses: azure/login@v2
        with:
           client-id: ${{ secrets.AZURE_CLIENT_ID }}
           tenant-id: ${{ secrets.AZURE_TENANT_ID }}
           subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: terraform init
        run: terraform init
        

      - name: terraform validate
        run: terraform validate
       

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v4
        with:
         tflint_version: latest

      - name: Tflint
        run: |
           tflint --init
           tflint --minimum-failure-severity=error
        

      - name: Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: ./Terraform/
          soft_fail: true

      - name: terraform plan
        if: false 
        run: terraform plan -out=tfplan
        working-directory: C:\AI\Azure-Landing zone\Azure-Landing-zone\Terraform\environment\dev

      - name: Atifact upload
        uses: actions/upload-artifact@v4
        with:
            name: terraform-plan
            path: C:\AI\Azure-Landing zone\Azure-Landing-zone\Terraform\environment\dev



        
      
