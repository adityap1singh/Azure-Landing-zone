name: CD Pipeline - GitOps & Security Scanning

on:
  pull_request:
      branches:
      - main


permissions:
  id-token: write
  contents: read

env:
  TF_WORKING_DIR: './Terraform/environment/dev'
  AKS_CLUSTER_NAME: 'aks-dev-cluster'
  RESOURCE_GROUP: 'rg_rg_rg1'

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Terraform Setup
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.13.0

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Terraform Init
        run: terraform init
        working-directory: ${{ env.TF_WORKING_DIR }}

      - name: Terraform Plan
        run: terraform plan -out=tfplan
        working-directory: ${{ env.TF_WORKING_DIR }}

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan
        working-directory: ${{ env.TF_WORKING_DIR }}

  argocd-gitops:
    name: ArgoCD GitOps Deployment
    runs-on: ubuntu-latest
    needs: terraform-deploy
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Install kubectl & kubelogin
        run: |
          sudo az aks install-cli

      - name: Get AKS Credentials
        run: |
          az aks get-credentials --resource-group ${{ env.RESOURCE_GROUP }} --name ${{ env.AKS_CLUSTER_NAME }} --overwrite-existing

      - name: Install Argo CD in AKS
        run: |
          kubectl create namespace argocd --dry-run=client -o yaml | kubectl apply -f -
          kubectl apply -n argocd -f https://raw.githubusercontent.com/argoproj/argo-cd/stable/manifests/install.yaml
          
          echo "Waiting for Argo CD API Server to become ready..."
          kubectl wait --namespace argocd --for=condition=ready pod --selector=app.kubernetes.io/name=argocd-server --timeout=300s

      - name: Configure and Apply GitOps Application
        run: |
          sed -i "s|REPO_URL|${{ github.server_url }}/${{ github.repository }}.git|g" gitops/argocd/argocd-app.yaml
          
          # Deploy Argo CD GitOps Application CRD
          kubectl apply -f gitops/argocd/argocd-app.yaml

      - name: Wait for GitOps Application Rollout & External IP
        id: app-endpoint
        run: |
          echo "Waiting for service External IP to be provisioned..."
          APP_IP=""
          for i in {1..30}; do
            APP_IP=$(kubectl get svc landingzone-app-service -n default -o jsonpath='{.status.loadBalancer.ingress[0].ip}' 2>/dev/null || true)
            if [ -n "$APP_IP" ]; then
              echo "Application is running at: http://$APP_IP"
              echo "APP_URL=http://$APP_IP" >> $GITHUB_ENV
              echo "APP_URL=http://$APP_IP" >> $GITHUB_OUTPUT
              break
            fi
            echo "Waiting for External IP (attempt $i/30)..."
            sleep 10
          done
          
          if [ -z "$APP_IP" ]; then
            echo "WARNING: LoadBalancer External IP was not provisioned in time. Using a placeholder for OWASP ZAP demonstration."
            echo "APP_URL=http://test-endpoint.local" >> $GITHUB_ENV
            echo "APP_URL=http://test-endpoint.local" >> $GITHUB_OUTPUT
          fi
    outputs:
      app_url: ${{ steps.app-endpoint.outputs.APP_URL }}

  security-scan:
    name: OWASP ZAP Security Scan (DAST)
    runs-on: ubuntu-latest
    needs: argocd-gitops
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.12.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          target: ${{ needs.argocd-gitops.outputs.app_url }}
          rules_file_name: '.zap/rules.tsv'
          cmd_options: '-a'
          fail_action: 'false' # Set to true to fail the build on high vulnerabilities

      - name: Archive ZAP Security Scan Report
        uses: actions/upload-artifact@v4
        with:
          name: owasp-zap-report
          path: zap_report.html
